<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KW 통합 멘토링</title><style>body{font:16px system-ui;margin:0;color:#173e36;background:#f4f8f6}header,main{padding:24px;max-width:1100px;margin:auto}button,input,select,textarea{font:inherit;padding:12px;margin:5px;border:1px solid #bdd2ca;border-radius:8px}button{background:#007e65;color:white;cursor:pointer}section,article{background:white;padding:20px;margin:15px 0;border-radius:12px}label{display:block}textarea{width:90%;min-height:120px}#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}#status{white-space:pre-wrap}h1{font-size:26px}</style><header><h1>KW 통합 멘토링</h1><button onclick="browse('mentors')">멘토 찾기</button><button onclick="browse('programs')">프로그램</button><button onclick="show('student')">학교 이메일 인증</button><button onclick="mine()">내 신청</button><button onclick="show('admin')">센터 관리</button><button onclick="logout()">로그아웃</button><p id="who"></p><p id="status" role="status"></p></header><main><section id="student" hidden><h2>학교 이메일 인증</h2><form onsubmit="requestCode(event)"><label>학교 이메일<input id="email" type="email" required></label><label>학번<input id="sid" pattern="[0-9]{6,15}" required></label><label>이름<input id="name" required></label><label><input id="consent" type="checkbox" required>인증과 신청 처리를 위한 개인정보 이용에 동의합니다.</label><p>이메일 소유 여부를 인증합니다. 이름과 학번은 직접 입력하며 학적 명부와 자동 대조하지 않습니다.</p><button>인증번호 받기</button></form><form onsubmit="verify(event)"><label>인증번호<input id="code" pattern="[0-9]{6}" required></label><button>인증</button></form></section><section id="admin" hidden><h2>센터 관리</h2><form onsubmit="adminLogin(event)"><label>관리자 비밀번호<input id="password" type="password" required></label><button>로그인</button></form><div id="manage" hidden><button onclick="backup()">Drive 전체 백업</button><button onclick="editRecord('saveMentor')">멘토 등록</button><button onclick="editRecord('saveProgram')">프로그램 등록</button><button onclick="editRecord('saveActivity')">활동 기록</button><button onclick="mine()">신청 관리</button><pre id="editorHelp"></pre><textarea id="record" aria-label="등록 자료 JSON"></textarea><button onclick="saveRecord()">자료 저장</button></div></section><section><label>지원 분야<select id="field" onchange="browse(current)"><option>전체</option><option>진로</option><option>직무·취업</option><option>학업</option><option>대학생활·적응</option></select></label><div id="cards"></div></section></main><script>
let token='',data={},current='mentors',challenge='',saveAction='';
const el=id=>document.getElementById(id); const tell=text=>el('status').textContent=text;
function rpc(body){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(r=>r.ok?resolve(r):reject(Error(r.error))).withFailureHandler(e=>reject(Error(e.message))).rpc({...body,token}));}
async function run(fn){try{tell('처리 중…');await fn();}catch(e){tell(e.message);}}
function show(id){['student','admin'].forEach(x=>el(x).hidden=x!==id);}
async function refresh(){data=await rpc({action:'state'});el('who').textContent=data.user?data.user.name+' 로그인 중':'';el('manage').hidden=data.user?.role!=='admin';}
function browse(type){run(async()=>{await refresh();current=type;const box=el('cards');box.replaceChildren();for(const row of data[type]||[]){if(el('field').value!=='전체'&&row.field!==el('field').value)continue;const card=document.createElement('article'),title=document.createElement('h2'),text=document.createElement('p'),button=document.createElement('button');title.textContent=row.name||row.title;text.textContent=[row.department,row.organization,row.field,row.description].filter(Boolean).join(' · ');button.textContent='신청';button.onclick=()=>apply(type,row);card.append(title,text,button);if(data.user?.role==='admin'){const edit=document.createElement('button');edit.textContent='수정';edit.onclick=()=>editRecord(type==='mentors'?'saveMentor':'saveProgram',row);card.append(edit);}box.append(card);}tell((data[type]||[]).length+'건');});}
function requestCode(e){e.preventDefault();run(async()=>{const r=await rpc({action:'requestCode',email:el('email').value,name:el('name').value,studentId:el('sid').value});challenge=r.challengeId;tell('학교 이메일로 발송했습니다. 10분 이내에 입력하세요.');});}
function verify(e){e.preventDefault();run(async()=>{const r=await rpc({action:'verifyCode',challengeId:challenge,code:el('code').value});token=r.token;el('code').value='';await refresh();tell('인증되었습니다.');});}
function adminLogin(e){e.preventDefault();run(async()=>{const r=await rpc({action:'adminLogin',password:el('password').value});el('password').value='';token=r.token;await refresh();tell('관리자로 로그인했습니다.');});}
function logout(){run(async()=>{await rpc({action:'logout'});token='';await refresh();browse(current);});}
function apply(type,row){if(!data.user||data.user.role!=='student'){show('student');tell('학교 이메일 인증 후 신청하세요.');return;}const goals=prompt('신청 목적과 질문을 10자 이상 작성하세요.');if(!goals)return;if(!confirm('학교 이메일·학번·이름과 신청 목적을 신청 처리에 이용하는 데 동의하고 접수하시겠습니까?'))return;run(async()=>{await rpc({action:'apply',type:type==='mentors'?'mentor':'program',targetId:row.id,goals,consent:true});tell('신청을 접수했습니다.');});}
function mine(){run(async()=>{await refresh();const box=el('cards');box.replaceChildren();for(const row of data.applications){const card=document.createElement('article');card.textContent=[row.targetName,row.studentName,row.status,row.goals].join(' · ');if(data.user?.role==='admin'){const button=document.createElement('button');button.textContent='처리 상태 수정';button.onclick=()=>editRecord('updateApplication',row);card.append(button);}box.append(card);}tell(data.applications.length+'건');});}
function editRecord(action,row){show('admin');saveAction=action;el('editorHelp').textContent='아래 자료를 확인하고 저장하세요. JSON 형식으로 입력합니다.';el('record').value=JSON.stringify(row|| (action==='saveMentor'?{name:'',department:'',organization:'',field:'진로',published:false,availability:'확인 필요'}:action==='saveProgram'?{title:'',department:'전체 학과',field:'진로',status:'운영안'}:{applicationId:'',date:'',content:'',participants:1,hours:1}),null,2);}
function saveRecord(){run(async()=>{const r=await rpc({action:saveAction,record:JSON.parse(el('record').value)});tell(r.backupPending?r.message:'저장과 Drive 백업이 완료됐습니다.');await refresh();});}
function backup(){run(async()=>{const r=await rpc({action:'backup'});tell('백업 완료');const a=document.createElement('a');a.href=r.url;a.target='_blank';a.rel='noopener';a.textContent='Drive 백업 열기';el('status').append(a);});}
browse('mentors');
</script></html>
